name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

permissions:
  contents: read

jobs:
  dependency-audit:
    name: RustSec dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1

      - name: Fail on RustSec advisories and warnings
        run: |
          cargo audit -D warnings
          cargo audit -D warnings --file demo-seeder/Cargo.lock

  test:
    name: cargo test (workspace, Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The producer's Docker image builds the public CLI with Rust 1.88.
        # Keep that compatibility contract alongside the current toolchain.
        rust: ['1.88.0', stable]
    steps:
      - uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.rust }}-

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (all targets and features, locked)
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: cargo test (workspace, locked)
        run: cargo test --locked --workspace --all-features

  wasm-build:
    name: wasm-pack build (verifier bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        # Pinned, reproducible install instead of piping a live remote
        # script into sh. Built from crates.io with the version bundled
        # lockfile so the toolchain is deterministic and auditable.
        run: cargo install wasm-pack --locked --version 0.14.0

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-wasm-

      - name: wasm-pack build (nodejs target)
        working-directory: spine-wasm
        run: wasm-pack build --target nodejs --release --out-dir pkg -- --locked

      - name: Report bundle size
        run: |
          ls -lh spine-wasm/pkg/spine_wasm_bg.wasm
          gzip -c spine-wasm/pkg/spine_wasm_bg.wasm | wc -c | awk '{printf "gzip: %s bytes (~%.0f KB)\n", $1, $1/1024}'

  seeder-and-integration:
    name: demo-seeder + wasm integration (Node)
    runs-on: ubuntu-latest
    needs: wasm-build
    steps:
      - uses: actions/checkout@v7

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        # Pinned, reproducible install instead of piping a live remote
        # script into sh. Built from crates.io with the version bundled
        # lockfile so the toolchain is deterministic and auditable.
        run: cargo install wasm-pack --locked --version 0.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: demo-seeder formatting, lints and deterministic contract
        working-directory: demo-seeder
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: demo-seeder (deterministic-seed 42)
        working-directory: demo-seeder
        run: cargo run --locked --release -- --deterministic-seed 42 --non-interactive --output-dir out-test

      - name: wasm-pack build
        working-directory: spine-wasm
        run: wasm-pack build --target nodejs --release --out-dir pkg -- --locked

      - name: Node integration test
        run: node spine-wasm/tests/integration.mjs
